# Requirements of the Agentic Thesis Workbench — the single list every verification links to.
#
# Each requirement: id, area, statement, source (where the code implements it) and `verified_by`, a list of links:
#   "tla:<Module>.tla#<Operator>@<config>.cfg"   an invariant/property that TLC proves with that configuration
#   "test:<file>::<Class>::<method>"             a test (conformance, property or example)
# The quality checks are requirements too: RF-QL-<check id>, generated from the check registry (verify/trace.py),
# each verified by tests/test_checks_each.py::Checks::test_<check id>.
#
# verify/trace.py checks that every link resolves and writes docs/REQUIREMENTS.md; tests/test_traceability.py fails
# when a requirement has no verification, a link is broken, a check has no requirement, or the document is stale.

