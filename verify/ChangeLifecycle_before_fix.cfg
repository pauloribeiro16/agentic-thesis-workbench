\* Before the fix: approving did not check that the old text is still in the file, so a tampered item could be
\* approved and then "applied" with the file unchanged. TLC must find AppliedMeansEdited violated.
SPECIFICATION Spec
CONSTANTS
  ApproveNeedsAnchor = FALSE
  MaxSteps = 5
INVARIANTS TypeOK AppliedMeansEdited
CHECK_DEADLOCK FALSE
