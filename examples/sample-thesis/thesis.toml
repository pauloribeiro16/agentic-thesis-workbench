[project]
title = "Sample Doctoral Dissertation"
author = "Jane Researcher"
language = "en-GB"
plan = ".thesis/plan.toml"   # the author's targets and rules live there

[format]
adapter = "markdown"
chapters_glob = "chapters/*.md"
compiler = "none"

[citations]
provider = "bibtex"
bib_file = "references.bib"
library_dir = "LITERATURE"
syntax = "author-year"
ledger_file = ".thesis/citations/ledger.json"

[agents]
dialogue_dir = ".thesis/dialogue"
proposals_file = ".thesis/proposals/proposals.json"
comments_dir = ".thesis/comments"
style_guide_file = ".thesis/style/guide.json"
moderator_name = "Jane"
sign_decisions = true

